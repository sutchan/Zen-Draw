<!DOCTYPE html>
<!-- prototype/index.html v5.7.5 —— 主流程 + 主题演示（与 prototypes.html 共享 tokens.css） -->
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZenDraw｜禅抽 · 高保真原型 v5.7.5</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
    }
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-4) var(--space-6);
      border-bottom: 1px solid var(--color-border);
    }
    nav .brand { font-size: var(--text-lg); font-weight: 700; letter-spacing: 0.02em; }
    nav .brand span { color: var(--color-primary); }
    nav .links { display: flex; gap: var(--space-4); align-items: center; }
    nav a { color: var(--color-muted); text-decoration: none; font-size: var(--text-sm); }
    nav a:hover { color: var(--color-fg); }
    .theme-toggle {
      background: var(--color-surface); color: var(--color-fg);
      border: 1px solid var(--color-border); border-radius: var(--radius-pill);
      padding: var(--space-2) var(--space-4); font-size: var(--text-sm); cursor: pointer;
      font-family: inherit;
    }
    .theme-toggle:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

    main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: var(--space-8) var(--space-4); gap: var(--space-6);
    }
    .hero { text-align: center; max-width: 640px; }
    .hero h1 { font-size: var(--text-3xl); font-weight: 800; line-height: 1.2; }
    .hero p { color: var(--color-muted); margin-top: var(--space-3); font-size: var(--text-base); }

    .display {
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 800; font-variant-numeric: tabular-nums;
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-lg); padding: var(--space-6) var(--space-8);
      min-width: 240px; text-align: center; box-shadow: var(--shadow-card);
      transition: transform var(--dur-slow) var(--ease);
    }
    .display.celebrate { transform: scale(1.04); }

    .controls { display: flex; gap: var(--space-3); flex-wrap: wrap; justify-content: center; }
    .btn {
      font-family: inherit; font-size: var(--text-base); font-weight: 600;
      border-radius: var(--radius-pill); padding: var(--space-3) var(--space-6);
      border: 1px solid transparent; cursor: pointer; transition: transform var(--dur-fast) var(--ease);
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    .btn-primary { background: var(--color-primary); color: var(--color-primary-fg); }
    .btn-ghost { background: transparent; color: var(--color-fg); border-color: var(--color-border); }

    .switch {
      display: inline-flex; align-items: center; gap: var(--space-3);
      font-size: var(--text-sm); color: var(--color-muted); cursor: pointer;
    }
    .switch .track {
      width: 42px; height: 24px; border-radius: var(--radius-pill);
      background: var(--color-border); position: relative; transition: background var(--dur) var(--ease);
    }
    .switch .track::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 20px; height: 20px; border-radius: 50%; background: #fff;
      transition: transform var(--dur) var(--ease);
    }
    .switch[aria-checked="true"] .track { background: var(--color-primary); }
    .switch[aria-checked="true"] .track::after { transform: translateX(18px); }
    .switch:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; border-radius: var(--radius-sm); }

    .toast {
      position: fixed; bottom: var(--space-6); left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--color-surface); color: var(--color-fg);
      border: 1px solid var(--color-border); border-radius: var(--radius-pill);
      padding: var(--space-3) var(--space-5); font-size: var(--text-sm);
      opacity: 0; pointer-events: none; transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
      box-shadow: var(--shadow-float);
    }
    .toast.show { opacity: 1; transform: translateX(-50%); }

    aside.history {
      position: fixed; top: 0; right: 0; height: 100vh; width: min(380px, 90vw);
      background: var(--color-surface); border-left: 1px solid var(--color-border);
      transform: translateX(100%); transition: transform var(--dur-slow) var(--ease);
      padding: var(--space-6); overflow-y: auto; box-shadow: var(--shadow-float);
    }
    aside.history.open { transform: translateX(0); }
    aside.history h2 { font-size: var(--text-xl); margin-bottom: var(--space-4); }
    aside.history .entry {
      display: flex; justify-content: space-between; align-items: center;
      padding: var(--space-3) 0; border-bottom: 1px solid var(--color-border);
      font-size: var(--text-sm);
    }
    aside.history .entry .num { font-size: var(--text-lg); font-weight: 700; font-variant-numeric: tabular-nums; }
    aside.history .entry .time { color: var(--color-muted); }
    aside.history .empty { color: var(--color-muted); text-align: center; padding: var(--space-8) 0; }
    aside.history .close {
      position: absolute; top: var(--space-4); right: var(--space-4);
      background: transparent; border: 1px solid var(--color-border); color: var(--color-fg);
      border-radius: var(--radius-pill); width: 32px; height: 32px; cursor: pointer; font-family: inherit;
    }
    aside.history .close:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

    footer { text-align: center; padding: var(--space-4); color: var(--color-muted); font-size: var(--text-xs); border-top: 1px solid var(--color-border); }

    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  </style>
</head>
<body>
  <nav aria-label="主导航">
    <div class="brand">Zen<span>Draw</span>｜禅抽</div>
    <div class="links">
      <a href="prototypes.html">状态机</a>
      <a href="wireframes.html">组件库</a>
      <button class="theme-toggle" id="themeToggle" aria-label="切换深浅色">🌓 深浅色</button>
    </div>
  </nav>

  <main aria-label="抽签主区">
    <section class="hero" aria-live="polite">
      <h1 id="heroTitle">静心一抽，随机见真章</h1>
      <p id="heroSub">点击抽取，或按 Space / Enter 开始，Esc 停止</p>
    </section>

    <div class="display" id="display" aria-label="抽签结果">—</div>

    <div class="controls">
      <button class="btn btn-primary" id="drawBtn" aria-keyshortcuts="Space Enter">开始抽取</button>
      <button class="btn btn-ghost" id="historyBtn" aria-haspopup="dialog">查看历史</button>
    </div>

    <label class="switch" id="soundSwitch" role="switch" aria-checked="true" tabindex="0">
      <span class="track" aria-hidden="true"></span>
      <span>音效</span>
    </label>
  </main>

  <aside class="history" id="historyPanel" role="dialog" aria-label="抽签历史" aria-modal="false">
    <button class="close" id="historyClose" aria-label="关闭历史">×</button>
    <h2>抽签历史</h2>
    <div id="historyList"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <footer>ZenDraw｜禅抽 v5.7.5 · 高保真原型 · 设计令牌见 tokens.css</footer>

  <script>
    (function () {
      var MIN = 1, MAX = 100;
      var display = document.getElementById('display');
      var drawBtn = document.getElementById('drawBtn');
      var historyBtn = document.getElementById('historyBtn');
      var historyPanel = document.getElementById('historyPanel');
      var historyClose = document.getElementById('historyClose');
      var historyList = document.getElementById('historyList');
      var toast = document.getElementById('toast');
      var soundSwitch = document.getElementById('soundSwitch');
      var themeToggle = document.getElementById('themeToggle');
      var confettiCanvas = document.getElementById('confetti');

      var state = 'welcome';        // welcome | drawing | result
      var rafId = null;
      var history = [];

      // 主题记忆（localStorage）：预设以 theme-* 类、深浅以 .dark 类
      try {
        var saved = JSON.parse(localStorage.getItem('zd-theme') || '{}');
        if (saved.theme && saved.theme !== 'default') document.documentElement.classList.add('theme-' + saved.theme);
        if (saved.dark === false) document.documentElement.classList.remove('dark');
      } catch (e) {}

      function secureRand() {
        var buf = new Uint32Array(1);
        crypto.getRandomValues(buf);
        return MIN + (buf[0] % (MAX - MIN + 1));
      }

      function renderHistory() {
        if (!history.length) {
          historyList.innerHTML = '<div class="empty">🎲 还没有抽签记录<br>点击「开始抽取」试试手气</div>';
          return;
        }
        historyList.innerHTML = history.map(function (h) {
          return '<div class="entry"><span class="num">' + h.num +
            '</span><span class="time">' + h.time + '</span></div>';
        }).join('');
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(function () { toast.classList.remove('show'); }, 1600);
      }

      function roll() {
        display.textContent = secureRand();
        rafId = requestAnimationFrame(roll);
      }

      function startDraw() {
        if (state === 'drawing') { stopDraw(); return; }
        state = 'drawing';
        drawBtn.textContent = '停止';
        roll();
      }

      function stopDraw() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
        var num = secureRand();
        display.textContent = num;
        state = 'result';
        drawBtn.textContent = '再来一次';
        burstConfetti();
        display.classList.add('celebrate');
        setTimeout(function () { display.classList.remove('celebrate'); }, 500);
        var now = new Date();
        var time = String(now.getHours()).padStart(2, '0') + ':' +
          String(now.getMinutes()).padStart(2, '0') + ':' +
          String(now.getSeconds()).padStart(2, '0');
        history.unshift({ num: num, time: time });
        if (history.length > 10) history.pop();
        renderHistory();
        showToast('已揭晓：' + num);
      }

      function goWelcome() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
        state = 'welcome';
        display.textContent = '—';
        drawBtn.textContent = '开始抽取';
      }

      drawBtn.addEventListener('click', function () {
        if (state === 'welcome') startDraw();
        else if (state === 'drawing') stopDraw();
        else goWelcome();
      });

      // 键盘：Space/Enter 触发主操作，Esc 停止
      document.addEventListener('keydown', function (e) {
        var tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
        if (e.code === 'Space' || e.code === 'Enter') {
          if (document.activeElement === drawBtn) return; // 避免双击
          e.preventDefault();
          drawBtn.click();
        } else if (e.code === 'Escape' && state === 'drawing') {
          stopDraw();
        }
      });

      // 历史抽屉
      historyBtn.addEventListener('click', function () {
        renderHistory();
        historyPanel.classList.add('open');
      });
      historyClose.addEventListener('click', function () {
        historyPanel.classList.remove('open');
      });

      // Switch 键盘可达（Enter/Space 切换）
      function toggleSound() {
        var on = soundSwitch.getAttribute('aria-checked') === 'true';
        soundSwitch.setAttribute('aria-checked', on ? 'false' : 'true');
      }
      soundSwitch.addEventListener('click', toggleSound);
      soundSwitch.addEventListener('keydown', function (e) {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); toggleSound(); }
      });

      // 深浅色切换 + 记忆（.dark 类）
      themeToggle.addEventListener('click', function () {
        var isDark = document.documentElement.classList.contains('dark');
        var next = isDark ? 'light' : 'dark';
        if (next === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        try {
          var saved = JSON.parse(localStorage.getItem('zd-theme') || '{}');
          saved.dark = next === 'dark';
          localStorage.setItem('zd-theme', JSON.stringify(saved));
        } catch (e) {}
      });

      // 彩屑（结果揭晓触发，prefers-reduced-motion 下不渲染）
      function burstConfetti() {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var ctx = confettiCanvas.getContext('2d');
        var W = confettiCanvas.width = window.innerWidth;
        var H = confettiCanvas.height = window.innerHeight;
        var colors = ['#6366f1', '#f43f5e', '#22c55e', '#f97316', '#a855f7'];
        var parts = [];
        for (var i = 0; i < 130; i++) {
          parts.push({
            x: W / 2, y: H / 3,
            vx: (Math.random() - 0.5) * 12,
            vy: Math.random() * -12 - 4,
            s: Math.random() * 4 + 3,
            c: colors[i % colors.length],
            a: 1
          });
        }
        var t0 = performance.now();
        (function frame(t) {
          ctx.clearRect(0, 0, W, H);
          var alive = false;
          parts.forEach(function (p) {
            p.vy += 0.4; p.x += p.vx; p.y += p.vy; p.a -= 0.012;
            if (p.a > 0) {
              alive = true;
              ctx.globalAlpha = Math.max(p.a, 0);
              ctx.fillStyle = p.c;
              ctx.fillRect(p.x, p.y, p.s, p.s);
            }
          });
          ctx.globalAlpha = 1;
          if (alive && t - t0 < 2000) requestAnimationFrame(frame);
          else ctx.clearRect(0, 0, W, H);
        })(t0);
      }

      renderHistory();
    })();
  </script>
</body>
</html>
